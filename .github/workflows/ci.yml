name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore Il2CppDumper.slnx

      - name: Build Solution
        run: dotnet build Il2CppDumper.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test Il2CppDumper.slnx -c Release --no-build --verbosity normal
